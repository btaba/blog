<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Rainbow Box Wall - Three.js</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
        }
        canvas {
            display: block;
        }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Camera position - facing the wall
        camera.position.set(4.3, 4.4, 6.5);
        camera.lookAt(0, 0, 0);

        // Add orbit controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Add smooth damping
        controls.dampingFactor = 0.05;
        controls.minDistance = 3; // Minimum zoom distance
        controls.maxDistance = 15; // Maximum zoom distance

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 1);
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(5, 5, 7);
        directionalLight1.castShadow = true;
        directionalLight1.shadow.camera.near = 0.1;
        directionalLight1.shadow.camera.far = 30;
        directionalLight1.shadow.camera.left = -10;
        directionalLight1.shadow.camera.right = 10;
        directionalLight1.shadow.camera.top = 10;
        directionalLight1.shadow.camera.bottom = -10;
        directionalLight1.shadow.mapSize.width = 2048;
        directionalLight1.shadow.mapSize.height = 2048;
        scene.add(directionalLight1);

        // Add a second light from different angle
        const directionalLight2 = new THREE.DirectionalLight(0xffffcc, 0.5);
        directionalLight2.position.set(-5, 3, 7);
        scene.add(directionalLight2);

        // Box creation function with rainbow shader
        function createRainbowBox(x, y, z) {
            const geometry = new THREE.BoxGeometry(1, 1, 1, 1, 1, 1);
            
            // Create custom shader material for rainbow effect
            const material =  new THREE.ShaderMaterial({
        uniforms: {
          time: { value: 0 },
          nodeOffset: { value: Math.random() * 1000.0 },
          gridScale: { value: 3.0 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          
          void main() {
            vUv = uv;
            vNormal = normalize(normalMatrix * normal);
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          uniform float time;
          uniform float nodeOffset;
          uniform float gridScale;
          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vViewPosition;
          
          vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
          }
          
          float hash(vec2 p) {
            return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }
          
          float circuit(vec2 uv) {
            vec2 grid = abs(fract(uv - 0.5) - 0.5) / fwidth(uv);
            float line = min(grid.x, grid.y);
            return 1.0 - min(line, 1.0);
          }
          
          void main() {
            vec2 uv = vUv;
            
            // Calculate reflection
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            
            // Static light (original)
            vec3 lightPos1 = vec3(5.0, 5.0, 7.0);
            vec3 lightDir1 = normalize(lightPos1);
            vec3 reflectDir1 = reflect(-lightDir1, normal);
            float spec1 = pow(max(dot(viewDir, reflectDir1), 0.0), 128.0); // Much sharper highlight
            
            // Moving light - sweeping on opposite side from camera
            float angle = time * 1.2;
            vec3 lightPos2 = vec3(
                -1.0 + sin(angle) * 2.0,     // X: sweep on opposite side from camera
                0.5 + cos(angle) * 2.0,     // Y: sweep below camera height
                0.0                         // Z: behind boxes relative to camera
            );
            vec3 lightDir2 = normalize(lightPos2);
            vec3 reflectDir2 = reflect(-lightDir2, normal);
            float spec2 = pow(max(dot(viewDir, reflectDir2), 0.0), 8.0); // Even softer highlight for broader visibility

            // Calculate face-based lighting with stronger front face emphasis
            float frontFace = max(0.0, dot(normal, vec3(0.0, 0.0, 1.0))) * 2.0; // Double weight for front face
            float rightFace = max(0.0, dot(normal, vec3(1.0, 0.0, 0.0)));
            float topFace = max(0.0, dot(normal, vec3(0.0, 1.0, 0.0)));
            float faceMask = frontFace + rightFace + topFace;
            
            // Enhanced specular with face masking and reduced intensity
            vec3 specular = vec3(0.6, 0.5, 0.4) * spec1 * 1.5 + // Softer static reflection
                           vec3(0.2, 0.4, 0.6) * spec2 * 2.0;    // Softer moving light
            
            // Apply face masking to specular
            specular *= faceMask;
            
            // Multiple scale circuit patterns
            float circuitLine1 = circuit(uv * (gridScale * 1.0));
            float circuitLine2 = circuit(uv * (gridScale * 2.0));
            float circuitLine3 = circuit(uv * (gridScale * 2.0));
            
            // Create nodes at intersections
            vec2 nodeGrid = floor(uv * gridScale);
            float timeOffset = time * 0.2;
            float randomValue = hash(nodeGrid + vec2(hash(nodeGrid), floor(timeOffset + nodeOffset)));
            float nodes = float(randomValue > 0.0) * 
                         smoothstep(0.1, 0.9, sin(time * 0.5 + randomValue * 6.28 + nodeOffset) * 0.5 + 0.5);
            
            // Pulse through the circuit
            float pulse = sin(uv.x * 10.0 - time * 3.0) * sin(uv.y * 10.0 - time * 2.0);
            pulse = smoothstep(0.0, 0.2, pulse) * 0.5;
            
            // Data flow animation
            float flow = fract(uv.x * 3.0 - time);
            flow = smoothstep(0.0, 0.1, flow) * smoothstep(0.5, 0.4, flow);
            flow *= circuitLine1;
            
            // Rainbow gradient
            float hue = fract(uv.x + uv.y + time * 0.1);
            vec3 baseColor = hsv2rgb(vec3(hue, 0.7, 0.5 + pulse * 0.5));
            
            // Combine circuit elements
            float circuitPattern = circuitLine1 * 0.5 + circuitLine2 * 0.3 + circuitLine3 * 0.1;
            
            // Add electronic component visual elements
            vec2 compGrid = fract(uv * gridScale);
            float components = smoothstep(0.45, 0.55, length(compGrid - 0.5)) * nodes;
            
            // Final color with reflection
            vec3 color = baseColor * (circuitPattern + 0.1);
            color += vec3(0.4, 0.5, 0.5) * flow;
            color *= (1.0 + nodes * 2.0);
            color += specular; // Add specular reflection
            
            gl_FragColor = vec4(color, 1.0);
          }
        `
      });
            
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(x, y, z);
            cube.castShadow = true;
            cube.receiveShadow = true;
            
            // Store original position and add custom animation parameters
            cube.userData.originalPosition = { x, y, z };
            cube.userData.material = material;
            cube.userData.animationOffset = Math.random() * Math.PI * 2; // Random phase offset
            cube.userData.animationSpeed = 0.5 + Math.random() * 0.3; // More controlled speed range
            cube.userData.movementPattern = Math.floor(Math.random() * 3); // Three smooth patterns
            cube.userData.maxDepth = 0.5 + Math.random() * 0.5; // Reduced depth range
            cube.userData.secondarySpeed = 0.15 + Math.random() * 0.2; // Slower secondary motion
            cube.userData.smoothness = 1.5 + Math.random() * 1.5; // Reduced smoothness range
            
            return cube;
        }

        // Animation parameters
        const params = {
            maxPunchDepth: 0.5,
            animationSpeed: 1.0,
            boxDepth: 2.5,
            gridSize: 3,
            gridSpacing: 1.04,
            cameraX: 2.3,
            cameraY: 2.3,
            cameraZ: 3.5
        };

        // Create boxes array
        const boxes = [];

        // Function to create grid of boxes
        function createGrid() {
            // Remove existing boxes
            boxes.forEach(box => scene.remove(box));
            boxes.length = 0;
            
            // Create new grid
            for (let row = 0; row < params.gridSize; row++) {
                for (let col = 0; col < params.gridSize; col++) {
                    // Calculate position based on grid
                    const x = (col - Math.floor(params.gridSize / 2)) * params.gridSpacing;
                    const y = (row - Math.floor(params.gridSize / 2)) * params.gridSpacing;
                    const z = 0; // All boxes start at z=0 (wall plane)
                    
                    const box = createRainbowBox(x, y, z);
                    // Initialize shader time to prevent first-frame glitches
                    box.userData.material.uniforms.time.value = initialTime;
                    scene.add(box);
                    boxes.push(box);
                }
            }
            // Apply current depth to new boxes
            updateBoxDepths();
        }

        // Initialize time offset to prevent initial animation glitches
        const initialTime = performance.now() * 0.001;

        // Add GUI controls
        const gui = new dat.GUI();
        const gridFolder = gui.addFolder('Grid Controls');
        gridFolder.add(params, 'gridSize', 2, 20, 1).name('Grid Size').onChange(() => createGrid());
        gridFolder.add(params, 'gridSpacing', 0.8, 2.0).name('Grid Spacing').onChange(() => createGrid());

        gui.add(params, 'maxPunchDepth', 0.1, 1.0).name('Punch Depth');
        gui.add(params, 'animationSpeed', 0.1, 3.0).name('Animation Speed');
        gui.add(params, 'boxDepth', 0.5, 3.0).name('Box Depth').onChange(() => updateBoxDepths());
        
        // Create initial grid
        createGrid();

        // Camera position controls
        const cameraFolder = gui.addFolder('Camera Position');
        cameraFolder.add(params, 'cameraX', -10, 10).name('Camera X').onChange(() => updateCameraPosition());
        cameraFolder.add(params, 'cameraY', -10, 10).name('Camera Y').onChange(() => updateCameraPosition());
        cameraFolder.add(params, 'cameraZ', 1, 15).name('Camera Z').onChange(() => updateCameraPosition());

        // Close the entire GUI by default
        gui.close();

        // Set initial camera position
        updateCameraPosition();

        // Function to update camera position
        function updateCameraPosition() {
            camera.position.set(params.cameraX, params.cameraY, params.cameraZ);
            camera.lookAt(0, 0, 0);
            // Update controls target and position to match
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // Function to update GUI when orbit controls change
        controls.addEventListener('change', () => {
            params.cameraX = camera.position.x;
            params.cameraY = camera.position.y;
            params.cameraZ = camera.position.z;
            // Force GUI to update
            for (let i = 0; i < cameraFolder.__controllers.length; i++) {
                cameraFolder.__controllers[i].updateDisplay();
            }
        });

        // Function to update box depths
        function updateBoxDepths() {
            boxes.forEach(box => {
                box.scale.z = params.boxDepth;
                // Adjust position to keep the front face in the same place
                box.position.z = box.userData.originalPosition.z - (params.boxDepth - 1) / 2;
            });
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            const time = performance.now() * 0.001;
            
            // Update controls
            controls.update();
            
            // Update each box
            boxes.forEach((box, index) => {
                const { originalPosition, animationOffset, animationSpeed, movementPattern, maxDepth, smoothness, secondarySpeed } = box.userData;
                
                // Calculate row and column for animation patterns
                const row = Math.floor(index / params.gridSize);
                const col = index % params.gridSize;
                
                // Calculate Z movement using different patterns
                let zOffset = 0;
                
                // Smooth easing function for startup with longer duration
                const easeInOutQuint = (x) => x < 0.5 ? 16 * x * x * x * x * x : 1 - Math.pow(-2 * x + 2, 5) / 2;
                const startupDuration = 2.0; // Longer startup duration (2 seconds)
                const startupProgress = Math.min(1, (time - initialTime) / startupDuration);
                const startupEase = easeInOutQuint(startupProgress);
                
                // Base time calculation without startup modification
                const baseTime = (time - initialTime) * params.animationSpeed * animationSpeed;
                
                // Blend between initial position and full animation
                const t = baseTime * startupEase + animationOffset;
                const secondary = Math.sin(t * secondarySpeed) * 0.2 * startupEase;
                
                switch(movementPattern) {
                    case 0: // Smooth organic
                        zOffset = Math.sin(t * 0.4) * maxDepth + secondary;
                        break;
                    case 1: // Fluid wave
                        zOffset = Math.sin(t * 0.5) * Math.cos(t * 0.3) * maxDepth + secondary;
                        break;
                    case 2: // Gentle pulse
                        zOffset = Math.sin(t * 0.6) * maxDepth + secondary;
                        break;
                }
                
                // Apply Z-position with smooth interpolation
                const targetZ = originalPosition.z - (zOffset * params.maxPunchDepth * startupEase);
                const interpolationSpeed = 0.1; // Constant interpolation speed
                box.position.z += (targetZ - box.position.z) * interpolationSpeed;
                
                // Update shader time uniform for rainbow effect
                const shaderTime = time + row * 0.2 + col * 0.2;
                box.userData.material.uniforms.time.value = shaderTime;
            });
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start animation
        animate();
    </script>
</body>
</html>
